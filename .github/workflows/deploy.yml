# The ONLY workflow that touches GitHub Pages. Publishes site/ on:
#   * push changing site/**  (e.g. data scraped locally, dashboard tweaks)
#   * completion of "Update listings" (fresh CI data)
#   * manual dispatch
# The Pages queue occasionally wedges for ~10 min, so the deploy is retried
# twice with a pause; concurrency serializes deployments so they never race.
name: Deploy site

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_run:
    workflows: ["Update listings"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rentgen-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `workflow_run` fires on COMPLETED, whatever the conclusion — so the three
    # scrapes that hit the 350-min timeout (2026-08-09/10) each triggered a
    # green deploy that republished the same stale `data` branch. A red pipeline
    # has to look red: a cancelled or failed scrape has nothing new to publish,
    # and the previous Pages deployment stays live either way.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.final.outputs.page_url || steps.try1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # workflow_run checks out the triggering sha; we want fresh main
      - name: Overlay data from the per-region data branches
        # site/data/ lives on orphan branches, not on main — a deploy is main's
        # site/ plus EVERY region's data. One branch per region (`data-<region>`)
        # so a scrape job fetches and force-pushes only its own; the pre-split
        # shared `data` branch is overlaid first and the per-region copies land
        # on top of it, which is what makes the split need no flag day. A hard
        # failure here (no data anywhere) keeps the previous deployment live.
        run: |
          git fetch origin '+refs/heads/data:refs/remotes/origin/data' || true
          git fetch origin '+refs/heads/data-*:refs/remotes/origin/data-*' || true
          if git checkout origin/data -- site/data 2>/dev/null; then
            echo "overlaid the pre-split shared data branch"
          else
            echo "no shared data branch (expected, once every region has its own)"
          fi
          for ref in $(git for-each-ref --format='%(refname:lstrip=3)' \
                       'refs/remotes/origin/data-*'); do
            region="${ref#data-}"
            # Look before wiping. The wipe is there so a run that emits fewer
            # detail shards than the last one leaves no surplus behind for the
            # site to fetch — but a branch without this region's directory (a
            # first run that died before writing) would then delete the copy
            # the shared branch just supplied and publish nothing at all.
            if ! git cat-file -e "origin/$ref:site/data/$region" 2>/dev/null; then
              echo "$ref carries no site/data/$region — leaving what we have"
              continue
            fi
            rm -rf "site/data/$region"
            git checkout "origin/$ref" -- "site/data/$region"
            echo "overlaid $region from $ref"
          done
          test -d site/data || { echo "::error::no data on any branch"; exit 1; }
          rm -f site/data/*/history.json.gz   # pipeline-only store, not served
      # Bakes fresh counts into the artifact's no-JS summary, Dataset JSON-LD,
      # sitemap lastmod and llms.txt — no commit to main (ubuntu runners ship Node).
      - name: Render no-JS summary + agent-discovery files
        run: node scripts/update-summary.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy (attempt 1)
        id: try1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000      # the action's hard maximum
      - name: Wait for the Pages queue to clear
        if: steps.try1.outcome == 'failure'
        run: sleep 300
      - name: Deploy (attempt 2)
        id: final
        if: steps.try1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
