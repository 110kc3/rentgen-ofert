# Scrape + push data. Does NOT deploy — deploy.yml picks up every completed
# run (workflow_run trigger) and publishes, with retries. This keeps exactly
# one deployment path, so two workflows never race for the Pages queue.
#
# STORAGE: scraped data + caches live on the orphan `data` branch, force-pushed
# as a SINGLE commit each run — never in main's git history (history.json alone
# is tens of MB; committing it to main twice a day was marching the repo into
# GitHub's 100 MB file / repo-size limits). The price history lives inside
# history.json.gz itself, so discarding old git versions loses nothing.
name: Update listings

on:
  schedule:
    - cron: "0 6,18 * * *"   # 06:00 and 18:00 UTC, every day
  workflow_dispatch:          # lets you run it manually from the Actions tab
    inputs:
      rcn:
        description: "RCN snapshot: 1 = cache (weekly refresh), force = re-pull now"
        required: false
        default: "1"
      region:
        description: "voivodeship slug to scrape (data goes to site/data/<region>/)"
        required: false
        default: "slaskie"
  push:
    branches: [main]
    # only scraper-affecting changes trigger the heavy scrape; pure site/
    # changes are published by the lightweight deploy.yml instead
    paths:
      - "scraper/**"
      - "overrides.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write             # force-push the refreshed `data` branch

concurrency:
  group: rentgen-scrape       # one scrape at a time (portals see the same IPs)
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # a wedged portal must not hold the runner for GitHub's full 6 h default —
    # per-request retry waits are capped in scraper/net.py and the photo phase
    # has its own budget, this is the last-resort backstop
    timeout-minutes: 300
    env:
      REGION: ${{ github.event.inputs.region || 'slaskie' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull current data + caches from the data branch
        run: |
          if git fetch origin data; then
            git checkout origin/data -- site/data cache || echo "data branch has no data yet"
            git reset -q      # keep the files, but untracked on main's checkout
          else
            echo "no data branch yet — starting fresh"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                                # reuse the pip download cache
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape listings
        env:
          RENTGEN_REGION: ${{ env.REGION }}
          RENTGEN_MAX_PAGES: "50"
          RENTGEN_DELAY: "0.7"
          RENTGEN_RCN: ${{ github.event.inputs.rcn || '1' }}
        run: python -u -m scraper.main   # -u: unbuffered logs, visible while running

      - name: Push refreshed data (single-commit data branch)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan refreshed-data
          git rm -r --cached -q . || true   # empty index (nothing tracked) is fine
          git add -f site/data cache
          git commit -m "data: ${REGION} refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin HEAD:data
