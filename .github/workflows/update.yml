# Scrape + push data. Does NOT deploy — deploy.yml picks up every completed
# run (workflow_run trigger) and publishes, with retries. This keeps exactly
# one deployment path, so two workflows never race for the Pages queue.
#
# STORAGE: scraped data + caches live on an orphan `data-<region>` branch,
# force-pushed as a SINGLE commit each run — never in main's git history
# (history.json alone is tens of MB; committing it to main twice a day was
# marching the repo into GitHub's 100 MB file / repo-size limits). The price
# history lives inside history.json.gz itself, so discarding old git versions
# loses nothing.
#
# ONE BRANCH PER REGION, because the shared `data` branch is what a second
# region would break: śląskie alone is ~150 MB, and every region's job would
# fetch, and force-push over, all of everyone's. Splitting it means a job
# touches only its own. The pre-split `data` branch is still read as a fallback
# here and still overlaid by deploy.yml, so this migrates with no flag day.
name: Update listings

on:
  schedule:
    - cron: "0 6,18 * * *"   # 06:00 and 18:00 UTC, every day
  workflow_dispatch:          # lets you run it manually from the Actions tab
    inputs:
      rcn:
        description: "RCN snapshot: 1 = cache (weekly refresh), force = re-pull now"
        required: false
        default: "1"
      region:
        description: "voivodeship slug to scrape (data goes to site/data/<region>/)"
        required: false
        default: "slaskie"
  push:
    branches: [main]
    # only scraper-affecting changes trigger the heavy scrape; pure site/
    # changes are published by the lightweight deploy.yml instead
    paths:
      - "scraper/**"
      - "overrides.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write             # force-push the refreshed `data` branch

concurrency:
  # One scrape at a time, ACROSS regions — deliberately not per-region. The
  # portals see one pool of runner IPs whichever voivodeship we are asking
  # about, and they are already refusing us: Otodom repeatedly rejects filtered
  # bands and OLX has answered 403 outright since 2026-08-11. Serialising is the
  # cheapest thing keeping that from getting worse. Parallelism, if it ever
  # comes, belongs in a matrix with `max-parallel` set explicitly.
  group: rentgen-scrape
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # a wedged portal must not hold the runner for GitHub's full 6 h default —
    # per-request retry waits are capped in scraper/net.py and the photo phase
    # has its own budget, this is the last-resort backstop. 350, not 300: the
    # first runs after the page cap was unpinned are the heaviest the project
    # has had (every portal paginates deeper, OLX subdivides per town, and the
    # phash cache is cold for everything that was previously invisible).
    timeout-minutes: 350
    env:
      REGION: ${{ github.event.inputs.region || 'slaskie' }}
      DATA_BRANCH: data-${{ github.event.inputs.region || 'slaskie' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull this region's data + caches from its data branch
        run: |
          if git fetch origin "$DATA_BRANCH"; then
            git checkout FETCH_HEAD -- site/data cache || echo "$DATA_BRANCH has no data yet"
            git reset -q      # keep the files, but untracked on main's checkout
          elif git fetch origin data; then
            # Pre-split shared branch: read once, until this region's own
            # branch exists. The push below writes only this region back.
            echo "no $DATA_BRANCH yet — seeding from the shared data branch"
            git checkout FETCH_HEAD -- site/data cache || echo "data branch has no data yet"
            git reset -q
          else
            echo "no data branch yet — starting fresh"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                                # reuse the pip download cache
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape listings
        env:
          RENTGEN_REGION: ${{ env.REGION }}
          # NO RENTGEN_MAX_PAGES here on purpose. It used to be pinned to "50",
          # which silently overrode the 200 default in scraper/main.py — so the
          # cap raise that recovered +757 gratka houses locally never once ran
          # in CI. The default lives in one place now; the run's `coverage`
          # block reports whether it still binds.
          RENTGEN_DELAY: "0.7"
          RENTGEN_RCN: ${{ github.event.inputs.rcn || '1' }}
        run: python -u -m scraper.main   # -u: unbuffered logs, visible while running

      - name: Push refreshed data (single-commit per-region data branch)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan refreshed-data
          git rm -r --cached -q . || true   # empty index (nothing tracked) is fine
          git add -f "site/data/$REGION"
          # This region's caches, plus the two that are not region-scoped. Named
          # rather than `git add cache`: a job seeded from the shared branch has
          # every region's caches in its tree, and a region's branch has no
          # business carrying another region's 15 MB phash cache around.
          for f in cache/geo_cache.json cache/nol_towns.json \
                   "cache/phash_${REGION}.json.gz" "cache/rcn_${REGION}.json.gz"; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "data: ${REGION} refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin "HEAD:${DATA_BRANCH}"
