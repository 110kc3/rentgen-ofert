<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="1; url=region/slaskie/stats/">
  <title>Przenoszenie do statystyk — Rentgen ofert</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <main class="redirect-card">
    <h1>Przenoszenie do statystyk</h1>
    <p><a id="legacy-target" href="region/slaskie/stats/">Otwórz statystyki woj. śląskiego</a></p>
  </main>
  <script>
    (() => {
      const current = new URL(location.href);
      const requested = current.searchParams.get("region") || "slaskie";
      const slug = /^[a-z]+(?:-[a-z]+)*$/.test(requested) ? requested : "slaskie";
      current.searchParams.delete("region");
      const target = new URL(`region/${slug}/stats/`, document.baseURI);
      target.search = current.search;
      target.hash = current.hash;
      document.querySelector("#legacy-target").href = target.href;
      location.replace(target);
    })();
  </script>
</body>
</html>
