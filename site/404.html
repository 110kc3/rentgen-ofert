<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <base href="/rentgen-ofert/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nie znaleziono strony — Rentgen ofert</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#f4f5f7; --card:#fff; --text:#1b1f24; --muted:#6b7280; --line:#e5e7eb; --accent:#1f6feb;
      --shadow:0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.05); }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1216; --card:#181c22; --text:#e6e8eb; --muted:#9aa3ad; --line:#2a2f37; --shadow:0 1px 2px rgba(0,0,0,.4); }
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--bg); color:var(--text); font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .card { max-width:460px; margin:20px; padding:32px 36px; background:var(--card);
      border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
    .code { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; }
    h1 { font-size:24px; margin:6px 0 10px; }
    p { color:var(--muted); margin:0 0 16px; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    nav { display:flex; gap:16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code" id="code">Błąd 404</div>
    <h1 id="title">Nie znaleziono strony</h1>
    <p id="message">Ten adres nie istnieje. Wybierz dostępne województwo z katalogu.</p>
    <nav>
      <a href="./">Wybierz województwo</a>
      <a href="region/slaskie/">Woj. śląskie</a>
    </nav>
  </div>
  <script>
    (() => {
      const match = location.pathname.match(/\/region\/([a-z]+(?:-[a-z]+)*)/);
      if (!match) return;
      fetch("data/regions.json", { cache: "no-store" }).then((response) => response.json())
        .then((catalog) => {
          const region = (catalog.regions || []).find((entry) => entry.slug === match[1]);
          if (region) {
            document.querySelector("#code").textContent = "Region bez publikacji";
            document.querySelector("#title").textContent = "Dane jeszcze niedostępne";
            document.querySelector("#message").textContent =
              `${region.label} jest skonfigurowane, ale regionalna baza nie została jeszcze opublikowana.`;
          } else {
            document.querySelector("#title").textContent = "Nieznane województwo";
            document.querySelector("#message").textContent =
              `Slug „${match[1]}” nie występuje w katalogu regionów.`;
          }
        }).catch(() => {});
    })();
  </script>
</body>
</html>
